<!-- Sistema de Alertas -->
<div id="alert-container" class="position-fixed top-0 start-0 w-100" style="z-index: 1050; margin-top: 76px;">
    <!-- Os alertas serão inseridos aqui via JavaScript -->
</div>

<script>
// Sistema de Alertas Global
class AlertSystem {
    constructor() {
        this.container = document.getElementById('alert-container');
        this.alertTimeout = null;
    }

    show(message, type = 'success', duration = 3000) {
        // Remover alertas existentes
        this.clear();
        
        // Criar novo alerta
        const alertId = 'alert-' + Date.now();
        const alertHtml = `
            <div id="${alertId}" class="alert alert-${type} alert-dismissible fade show mx-3 shadow-sm" role="alert">
                <div class="d-flex align-items-center">
                    <i class="bi bi-${this.getIcon(type)} me-2"></i>
                    <span>${message}</span>
                    <button type="button" class="btn-close ms-auto" onclick="alertSystem.clear()"></button>
                </div>
            </div>
        `;
        
        this.container.insertAdjacentHTML('beforeend', alertHtml);
        
        // Auto-remover após duração especificada
        this.alertTimeout = setTimeout(() => {
            this.clear();
        }, duration);
    }

    clear() {
        if (this.alertTimeout) {
            clearTimeout(this.alertTimeout);
            this.alertTimeout = null;
        }
        this.container.innerHTML = '';
    }

    getIcon(type) {
        const icons = {
            'success': 'check-circle-fill',
            'error': 'x-circle-fill',
            'warning': 'exclamation-triangle-fill',
            'info': 'info-circle-fill',
            'login': 'box-arrow-in-right',
            'logout': 'box-arrow-right'
        };
        return icons[type] || 'info-circle-fill';
    }

    // Métodos específicos para diferentes tipos de operações
    success(message) {
        this.show(message, 'success');
    }

    error(message) {
        this.show(message, 'error');
    }

    warning(message) {
        this.show(message, 'warning');
    }

    info(message) {
        this.show(message, 'info');
    }

    login(message) {
        this.show(message, 'login');
    }

    logout(message) {
        this.show(message, 'logout');
    }
}

// Instância global
window.alertSystem = new AlertSystem();

// Interceptar mensagens do Django
document.addEventListener('DOMContentLoaded', function() {
    // Verificar se há mensagens do Django
    const messages = document.querySelectorAll('.alert');
    messages.forEach(alert => {
        const message = alert.textContent.trim();
        
        // Verificar se é uma mensagem de alerta personalizada
        if (message.startsWith('ALERT:')) {
            const parts = message.split(':');
            if (parts.length >= 3) {
                const type = parts[1];
                const alertMessage = parts.slice(2).join(':');
                alertSystem.show(alertMessage, type);
            }
        } else {
            // Mensagem normal do Django
            const type = alert.classList.contains('alert-success') ? 'success' :
                        alert.classList.contains('alert-danger') ? 'error' :
                        alert.classList.contains('alert-warning') ? 'warning' :
                        alert.classList.contains('alert-info') ? 'info' : 'info';
            
            alertSystem.show(message, type);
        }
        
        // Remover alerta original
        alert.remove();
    });
});
</script>

<style>
#alert-container .alert {
    border: none;
    border-radius: 8px;
    font-weight: 500;
    animation: slideDown 0.3s ease-out;
}

@keyframes slideDown {
    from {
        transform: translateY(-100%);
        opacity: 0;
    }
    to {
        transform: translateY(0);
        opacity: 1;
    }
}

.alert-success {
    background: linear-gradient(135deg, #d4edda 0%, #c3e6cb 100%);
    color: #155724;
    border-left: 4px solid #28a745;
}

.alert-error {
    background: linear-gradient(135deg, #f8d7da 0%, #f5c6cb 100%);
    color: #721c24;
    border-left: 4px solid #dc3545;
}

.alert-warning {
    background: linear-gradient(135deg, #fff3cd 0%, #ffeaa7 100%);
    color: #856404;
    border-left: 4px solid #ffc107;
}

.alert-info {
    background: linear-gradient(135deg, #d1ecf1 0%, #bee5eb 100%);
    color: #0c5460;
    border-left: 4px solid #17a2b8;
}

.alert-login {
    background: linear-gradient(135deg, #e2e3e5 0%, #d6d8db 100%);
    color: #383d41;
    border-left: 4px solid #6c757d;
}

.alert-logout {
    background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
    color: #495057;
    border-left: 4px solid #6c757d;
}
</style>
